<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trabajos | Autonivelantes JJ Morales</title>
  <meta name="description" content="Especialistas en nivelación con autonivelante, hormigón aligerado, gunitado de piscinas y piscinas de arena." />
  <link rel="stylesheet" href="../css/style.css?v=29" />
</head>
<body>
  <main>
      <header class="nav">
        <a class="brand" href="../">
          <span>J&amp;J</span>
          <div>
            <strong>Autonivelantes JJ Morales</strong>
            <small>Nivelación y piscinas</small>
          </div>
        </a>
        <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="mainMenu"><span></span><span></span><span></span></button>
        <nav id="mainMenu" aria-label="Navegación principal">
          <a class="" href="../servicios/">Servicios</a> <a class="" href="../proceso/">Proceso</a> <a class="active" href="../trabajos/">Trabajos</a> <a class="budget-link" href="../presupuesto/">Presupuesto</a>
        </nav>
      </header>
      <section id="trabajos" class="section projects media-projects">
        <div class="section-header compact">
          <p class="label">Trabajos</p>
          <h2>Proyectos reales</h2>
          <p>Imágenes y vídeos de aplicaciones reales de autonivelante en obra.</p>
        </div>

        <div class="media-wall" aria-label="Galería de trabajos realizados">
          <article class="media-item media-feature">
            <img src="../img/trabajo-suelo-amplio.jpg" alt="Suelo autonivelante aplicado en una obra" />
          </article>
          <article class="media-item">
            <img src="../img/trabajo-acabado.jpg" alt="Acabado de autonivelante en planta de obra" />
          </article>
          <article class="media-item media-vertical">
            <img src="../img/trabajo-aplicacion.jpg" alt="Aplicación de autonivelante durante el trabajo" />
          </article>
          <article class="media-item">
            <img src="../img/trabajo-maquina.jpg" alt="Maquinaria de aplicación de autonivelante" />
          </article>
        </div>

        <div class="video-block">
          <div>
            <p class="label">Vídeos</p>
            <h3>Proceso en obra</h3>
          </div>
          <div class="video-grid">
            <video controls muted playsinline preload="metadata" poster="../img/poster-aplicacion.jpg">
              <source src="../video/aplicacion-autonivelante.mp4" type="video/mp4" />
              Tu navegador no puede reproducir este vídeo.
            </video>
            <video controls muted playsinline preload="metadata" poster="../img/poster-proceso.jpg">
              <source src="../video/proceso-en-obra.mp4" type="video/mp4" />
              Tu navegador no puede reproducir este vídeo.
            </video>
          </div>
        </div>
      </section>
      <footer><strong>Autonivelantes JJ Morales</strong><span>Nivelación, autonivelante, hormigón aligerado y piscinas.</span></footer>
  </main>
  <script src="../js/main.js?v=29"></script>
</body>
</html>
